name: Tauri CI Pipeline

on:
  push:
    paths:
      - 'tauri_ui/**'
    branches: [ main, master, develop ]
  pull_request:
    paths:
      - 'tauri_ui/**'
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri_ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libappindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri_ui/src-tauri

      - name: Install Frontend Dependencies
        run: npm install

      - name: Create Mock .env for Build
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi

      - name: Build Tauri Application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: tauri_ui
          tagName: v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: tauri-linux-build
          path: |
            tauri_ui/src-tauri/target/release/bundle/
